<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>Ashu &amp; Monu — We're Engaged</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #d4af37;
      --gold-soft: #f0d78c;
      --blush: #e8b4b8;
      --ivory: #faf6f0;
      --wine: #4a1c2a;
      --rose: #c45c6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: radial-gradient(ellipse at 50% 20%, #5c2434 0%, #2a1018 55%, #12080c 100%);
      color: var(--ivory);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .stage {
      position: relative;
      width: min(720px, 100%);
      max-height: none;
      text-align: center;
      padding: clamp(36px, 8vw, 64px) clamp(18px, 6vw, 36px) clamp(32px, 7vw, 52px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      background:
        linear-gradient(180deg, rgba(74, 28, 42, 0.55) 0%, rgba(18, 8, 12, 0.7) 100%);
      box-shadow:
        0 0 0 8px rgba(212, 175, 55, 0.08),
        0 30px 80px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      animation: frameGlow 4s ease-in-out infinite;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      width: clamp(42px, 12vw, 90px);
      height: clamp(42px, 12vw, 90px);
      border: 2px solid var(--gold);
      opacity: 0.55;
      pointer-events: none;
    }
    .stage::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
    .stage::after { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--gold-soft);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold);
      animation: twinkle 2.4s ease-in-out infinite;
    }
    .s1 { top: 18%; left: 12%; animation-delay: 0s; }
    .s2 { top: 28%; right: 14%; animation-delay: 0.6s; }
    .s3 { bottom: 22%; left: 18%; animation-delay: 1.1s; }
    .s4 { bottom: 16%; right: 20%; animation-delay: 1.7s; }
    .s5 { top: 48%; left: 8%; animation-delay: 0.3s; }
    .s6 { top: 58%; right: 9%; animation-delay: 1.4s; }

    .kicker {
      letter-spacing: clamp(0.18em, 3.5vw, 0.42em);
      text-transform: uppercase;
      font-size: clamp(0.62rem, 2.8vw, 0.72rem);
      color: var(--gold-soft);
      opacity: 0;
      animation: fadeUp 1s ease 0.2s forwards;
    }

    .ornament {
      margin: 18px auto 10px;
      width: 160px;
      height: 18px;
      opacity: 0;
      animation: fadeUp 1s ease 0.45s forwards;
    }

    h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.6rem, 14vw, 5.6rem);
      font-weight: 400;
      line-height: 1.12;
      color: var(--ivory);
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      padding: 0 8px;
      word-break: break-word;
    }

    .name {
      display: inline-block;
      opacity: 0;
      transform: translateY(24px);
    }
    .name.groom { animation: nameIn 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.7s forwards; }
    .name.bride { animation: nameIn 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.35s forwards; }

    .amp {
      display: block;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 1.6rem;
      color: var(--gold);
      margin: 6px 0;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.05s forwards;
    }

    .rings {
      margin: 28px auto 18px;
      width: 88px;
      height: 56px;
      position: relative;
      opacity: 0;
      animation: fadeUp 1s ease 1.7s forwards;
    }

    .ring {
      position: absolute;
      width: 42px;
      height: 42px;
      border: 3px solid var(--gold);
      border-radius: 50%;
      box-shadow: inset 0 0 8px rgba(240, 215, 140, 0.45), 0 0 12px rgba(212, 175, 55, 0.35);
    }
    .ring.left { left: 8px; top: 7px; animation: ringPulse 2.6s ease-in-out 1.9s infinite; }
    .ring.right { right: 8px; top: 7px; animation: ringPulse 2.6s ease-in-out 2.2s infinite; }

    .diamond {
      position: absolute;
      left: 50%;
      top: 0;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      background: linear-gradient(135deg, #fff, var(--gold-soft));
      transform: rotate(45deg);
      box-shadow: 0 0 14px #fff;
      animation: spark 1.6s ease-in-out infinite;
    }

    .headline {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.15rem, 5.2vw, 2.1rem);
      letter-spacing: clamp(0.08em, 2.4vw, 0.18em);
      text-transform: uppercase;
      color: var(--gold-soft);
      opacity: 0;
      animation: fadeUp 1s ease 1.95s forwards;
      padding: 0 4px;
    }

    .date {
      margin: 14px auto 0;
      font-family: "Montserrat", sans-serif;
      font-weight: 400;
      font-size: clamp(0.78rem, 3.2vw, 0.95rem);
      letter-spacing: clamp(0.14em, 2.2vw, 0.28em);
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 1s ease 2.1s forwards;
    }

    .message {
      margin: 22px auto 0;
      max-width: min(420px, 100%);
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: clamp(1.05rem, 4.2vw, 1.25rem);
      line-height: 1.55;
      color: rgba(250, 246, 240, 0.88);
      opacity: 0;
      animation: fadeUp 1s ease 2.25s forwards;
      padding: 0 4px;
    }

    .hearts, .petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart, .petal {
      position: absolute;
      bottom: -40px;
      animation: floatUp linear infinite;
      opacity: 0.75;
    }

    .heart {
      color: var(--blush);
      font-size: 18px;
    }

    .petal {
      width: 14px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #ffd6dc, var(--rose));
      border-radius: 70% 0 70% 0;
      transform: rotate(20deg);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes nameIn {
      0% { opacity: 0; transform: translateY(28px) scale(0.96); }
      60% { opacity: 1; transform: translateY(-4px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes spark {
      0%, 100% { opacity: 0.6; box-shadow: 0 0 6px #fff; }
      50% { opacity: 1; box-shadow: 0 0 18px #fff, 0 0 28px var(--gold); }
    }

    @keyframes frameGlow {
      0%, 100% { box-shadow: 0 0 0 8px rgba(212, 175, 55, 0.08), 0 30px 80px rgba(0, 0, 0, 0.45); }
      50% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0.16), 0 30px 90px rgba(196, 92, 106, 0.18); }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(280deg); opacity: 0; }
    }

    @media (max-width: 520px) {
      body { padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
      .stage {
        box-shadow:
          0 0 0 4px rgba(212, 175, 55, 0.08),
          0 16px 40px rgba(0, 0, 0, 0.4);
      }
      .ornament { width: min(140px, 70vw); }
      .rings { margin: 20px auto 14px; }
    }

    @media (max-width: 360px) {
      h1 { font-size: clamp(2.2rem, 16vw, 3rem); }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      body {
        align-items: stretch;
        padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      .stage {
        padding: 20px 28px 18px;
        margin: auto;
      }
      .ornament { margin: 8px auto 4px; }
      .rings { margin: 10px auto 8px; }
      .message { margin-top: 10px; }
      h1 { font-size: clamp(2rem, 8vh, 3.4rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .name, .amp, .kicker, .ornament, .rings, .headline, .date, .message {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <span class="sparkle s1"></span>
    <span class="sparkle s2"></span>
    <span class="sparkle s3"></span>
    <span class="sparkle s4"></span>
    <span class="sparkle s5"></span>
    <span class="sparkle s6"></span>

    <p class="kicker">Together forever</p>
    <svg class="ornament" viewBox="0 0 160 18" fill="none" aria-hidden="true">
      <path d="M8 9h52M100 9h52" stroke="#d4af37" stroke-width="1" />
      <circle cx="80" cy="9" r="4" fill="#d4af37" />
      <circle cx="68" cy="9" r="2" fill="#f0d78c" />
      <circle cx="92" cy="9" r="2" fill="#f0d78c" />
    </svg>

    <h1>
      <span class="name groom">Ashu</span>
      <span class="amp">&amp;</span>
      <span class="name bride">Monu</span>
    </h1>

    <div class="rings" aria-hidden="true">
      <span class="ring left"></span>
      <span class="ring right"></span>
      <span class="diamond"></span>
    </div>

    <p class="headline">We're Engaged</p>
    <p class="date">26th Sep 2026</p>
    <p class="message">
      Two hearts, one promise. Celebrate the beginning of Ashu and Monu’s forever.
    </p>

    <div class="hearts" id="hearts"></div>
    <div class="petals" id="petals"></div>
  </main>

  <script>
    const isNarrow = window.matchMedia("(max-width: 640px)").matches;
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function sprinkle(containerId, className, count, content) {
      if (reduced) return;
      const root = document.getElementById(containerId);
      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = className;
        if (content) el.textContent = content;
        el.style.left = Math.random() * 100 + "%";
        el.style.animationDuration = 7 + Math.random() * 8 + "s";
        el.style.animationDelay = Math.random() * 6 + "s";
        el.style.fontSize = 12 + Math.random() * 14 + "px";
        root.appendChild(el);
      }
    }

    sprinkle("hearts", "heart", isNarrow ? 8 : 14, "♥");
    sprinkle("petals", "petal", isNarrow ? 10 : 18);
  </script>
</body>
</html>
